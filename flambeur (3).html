<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a080c">
<meta name="description" content="Jeu de société de bluff, d'estimation et de connaissances insolites.">
<title>Flambeur !</title>

<!-- Manifest Inline pour PWA / PWABuilder -->
<link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Flambeur%20%21%22%2C%22short_name%22%3A%22Flambeur%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%232a080c%22%2C%22theme_color%22%3A%22%232a080c%22%2C%22description%22%3A%22Jeu%20de%20bluff%20et%20d%27estimation%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%3Butf8%2C%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20512%20512%27%3E%3Ccircle%20cx%3D%27256%27%20cy%3D%27256%27%20r%3D%27240%27%20fill%3D%27%23330b0f%27%20stroke%3D%27%23f3ca65%27%20stroke-width%3D%2716%27%2F%3E%3Cpath%20d%3D%27M256%20100c30%2050%2080%2080%2080%20150%200%2050-35%2090-80%2090s-80-40-80-90c0-45%2025-65%2035-90%2010%2020%2020%2025%2030%2025%200-30-15-60%2015-85z%27%20fill%3D%27%23f3ca65%27%2F%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">

<style>
:root{
  --bg:#2a080c;
  --fg:#fceee6;
  --mut:#d1a193;
  --card:#3d1217;
  --line:#5c232a;
  --acc:#ff3b30;
  --gold:#f3ca65;
  --gold-dark:#d4af37;
  --on:#f3ca65;
  --onfg:#2a080c;
  --felt:#3d1217;
  --chip:#ff3b30;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2a080c;--fg:#fceee6;--mut:#d1a193;--card:#3d1217;--line:#5c232a;--acc:#ff5247;--gold:#f3ca65;--gold-dark:#d4af37;--on:#f3ca65;--onfg:#2a080c;color-scheme:dark
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;user-select:none}
main{max-width:500px;margin:0 auto;padding:12px 16px 40px}
h1,h2,.big{font-family:Georgia,serif}
h1{font-size:42px;line-height:1;margin:12px 0 6px;letter-spacing:-.02em;color:var(--gold);text-align:center;text-shadow:0 2px 10px rgba(0,0,0,0.7)}
h2{font-size:22px;margin:0 0 8px;color:var(--gold)}
p{margin:0 0 10px}.mut{color:var(--mut)}
label{display:block;font-size:14px;margin-top:8px}

.top-nav{display:flex;justify-content:space-between;align-items:center;padding:8px 0;margin-bottom:8px;border-bottom:1px solid var(--line)}
.mode-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--gold);text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;background:rgba(0,0,0,0.3);color:var(--gold);display:inline-flex;align-items:center;gap:6px}
.mode-badge.dev{background:var(--gold);color:var(--bg);border-color:var(--gold)}

.card{background:var(--card);border:1.5px solid var(--gold);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 6px 22px rgba(0,0,0,.6)}
.qc{background:linear-gradient(135deg, #4a171e 0%, #2e0a0f 100%);color:#fceee6;border:2px solid var(--gold);border-radius:16px;padding:16px 16px 16px 40px;position:relative;box-shadow:inset 0 0 15px rgba(243,202,101,.15), 0 4px 15px rgba(0,0,0,0.5)}
.qc::before{content:"?";position:absolute;top:12px;left:14px;font:700 26px Georgia,serif;color:var(--gold)}
.qc .mut{color:var(--mut)}

.btn{font:inherit;font-weight:700;border:1.5px solid var(--gold);background:transparent;color:var(--gold);border-radius:12px;padding:12px 16px;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;text-align:center;transition:all .15s ease-in-out;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
.btn:active{transform:scale(0.97)}
.btn:hover{background:var(--gold);color:var(--bg);box-shadow:0 0 12px rgba(243,202,101,0.4)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.pri{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn.pri:hover{background:var(--gold-dark);color:var(--bg)}
.btn.red{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.red:hover{background:#e03229}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1}
input[type=text],input[type=number],input[type=password],textarea{font:inherit;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-height:48px;user-select:text}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
.sb{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chip{display:flex;gap:8px;align-items:baseline;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;background:var(--card)}
.chip b{font-family:Georgia,serif;font-size:18px;color:var(--gold)}
.chip.on{border-color:var(--gold);background:#4a171e;box-shadow:inset 0 0 0 1px var(--gold), 0 0 10px rgba(243,202,101,0.3)}
.q{font-family:Georgia,serif;font-size:21px;line-height:1.3;margin:6px 0}
.bid{display:inline-block;border:3px dashed var(--gold);border-radius:999px;padding:8px 26px;margin:6px 0;max-width:100%;background:rgba(0,0,0,.35)}
.big{font-size:42px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:0;word-break:break-all;color:var(--gold);text-shadow:0 0 12px rgba(243,202,101,0.3)}
.err{color:var(--acc);font-weight:600;min-height:22px;margin:6px 0 0}
.hist{font-size:14px;color:var(--mut);margin:6px 0 0}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:16px}
.modal>div{background:var(--card);color:var(--fg);border:2px solid var(--gold);border-radius:18px;padding:20px;max-width:500px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,0.9)}
.modal .btn{display:block;width:100%;margin:8px 0;text-align:left}
details{margin:10px 0}summary{cursor:pointer;font-weight:700;padding:6px 0;color:var(--gold)}
.jk{border:1px dashed var(--gold);border-radius:12px;padding:12px;margin:8px 0;background:rgba(0,0,0,.25)}
.up{font-size:13px;color:var(--mut);margin-top:12px}

.hero{background:linear-gradient(145deg, #4a171e 0%, #1f0508 100%);color:var(--fg);border-radius:24px;padding:24px 18px;text-align:center;box-shadow:inset 0 0 20px rgba(243,202,101,.25), 0 10px 30px rgba(0,0,0,0.7);margin:6px 0 14px;border:1.5px solid var(--gold)}
.hero-logo-wrap{width:140px;height:140px;margin:0 auto;filter:drop-shadow(0 6px 15px rgba(0,0,0,0.8))}
.hero-logo-wrap svg{width:100%;height:100%}
</style></head><body><main id="app"></main>
<script>
const PIN = "1234";

const BASE=[
  {q:`Combien de tonnes de biscuits de la marque BN ont été produites en 2018 ?`,u:"tonnes",a:18700,s:"Wikipédia"},
  {q:`Combien y a-t-il environ de grains de riz dans un paquet d’1 kg ?`,u:"grains",a:15432,s:"Calcul à partir d’environ 65 mg par grain"},
  {q:`Combien de fenêtres ont été vendues en France métropolitaine en 2019 ?`,u:"fenêtres",a:10026000,s:"UFME, Union des fabricants de menuiserie extérieure"},
  {q:`En combien d'heures un avion fait-il le tour de la Terre le long de l’équateur ?`,u:"heures",a:46,s:"Calcul : 40 075 ÷ 865 ≈ 46 h 20 min"},
  {q:`Quel pourcentage des Français porte des lunettes ?`,u:"%",a:72,s:"Optique 2000"},
  {q:`Combien de coureurs ont porté le maillot jaune du Tour de France depuis 1947 ?`,u:"coureurs",a:236,s:"Le Dico du Tour"},
  {q:`Combien de fois Clash Royale a-t-il été téléchargé dans le monde depuis sa création en 2016 ?`,u:"millions",a:723,s:"Udonis"},
  {q:`Combien de stylos BIC sont achetés par jour dans le monde en 2023 ?`,u:"stylos",a:273972,s:"Le Stylo Publicitaire"},
  {q:`Quelle distance un stylo BIC peut-il écrire en continu ?`,u:"mètres",a:2000,s:"Le Stylo Publicitaire"},
  {q:`Combien existe-t-il d’éléments chimiques ?`,u:"éléments",a:118,s:"IUPAC, tableau périodique"},
  {q:`La plus forte rafale de vent hors tornade a été relevée en Australie en 1996. Quelle était sa vitesse ?`,u:"km/h",a:408,s:"Géoclimat"},
  {q:`Quelle est la plus grande somme gagnée au Loto en France ?`,u:"millions d’euros",a:30,s:"Midi Libre"},
  {q:`Combien de points LeBron James a-t-il marqués le 27 décembre 2015 contre Portland ?`,u:"points",a:12,s:"ESPN"},
  {q:`Combien de litres d’eau faut-il pour fabriquer un jean ?`,u:"litres",a:7000,s:"Kamilou"},
  {q:`Quelle est la population du Kirghizistan en 2026 ?`,u:"habitants",a:7437853,s:"Worldometer"}
];

const NAME="Flambeur !";
document.title=NAME;

const LOGO=`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Flambeur !">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="30%" stop-color="#f3ca65"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997517"/>
    </linearGradient>
    <radialGradient id="red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#521219"/>
      <stop offset="75%" stop-color="#330b0f"/>
      <stop offset="100%" stop-color="#1f0507"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <path id="textArc" d="M 35 128 A 68 68 0 0 0 165 128" />
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#red)" stroke="url(#gold)" stroke-width="5" filter="url(#shadow)"/>
  <g stroke="url(#gold)" stroke-width="8" opacity="0.9">
    <line x1="100" y1="8" x2="100" y2="20" />
    <line x1="100" y1="180" x2="100" y2="192" />
    <line x1="8" y1="100" x2="20" y2="100" />
    <line x1="180" y1="100" x2="192" y2="100" />
    <line x1="35" y1="35" x2="44" y2="44" />
    <line x1="156" y1="156" x2="165" y2="165" />
    <line x1="165" y1="35" x2="156" y2="44" />
    <line x1="44" y1="156" x2="35" y2="165" />
  </g>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="100" cy="100" r="74" fill="#240609" stroke="url(#gold)" stroke-width="2"/>
  <g transform="translate(0, -10)" filter="url(#glow)">
    <path d="M 100 35 C 112 55 132 68 132 95 C 132 115 118 130 100 130 C 82 130 68 115 68 95 C 68 78 78 70 82 60 C 85 70 90 73 95 73 C 95 60 90 48 100 35 Z" fill="url(#gold)"/>
    <path d="M 100 72 C 106 80 114 85 114 97 C 114 107 108 112 100 112 C 92 112 86 107 86 97 C 86 88 94 85 100 72 Z" fill="#d6342c"/>
  </g>
  <g fill="url(#gold)">
    <circle cx="58" cy="40" r="3"/>
    <circle cx="50" cy="48" r="3"/>
    <circle cx="142" cy="40" r="3"/>
    <circle cx="150" cy="48" r="3"/>
  </g>
  <text font-family="Georgia, serif" font-weight="900" font-size="20" fill="url(#gold)" filter="url(#shadow)" letter-spacing="2">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      FLAMBEUR !
    </textPath>
  </text>
</svg>`;

const JK={
  miroir:["Le Miroir","À ton tour, réorganise comme tu veux les chiffres de la dernière mise, même si le nombre baisse."],
  regard:["Le Regard Indiscret","Regarde les jokers d’un adversaire et interdis-lui d’en utiliser un jusqu’à la fin de la manche."],
  fourchette:["La Fourchette Forcée","Après ta mise, impose au joueur suivant une fourchette serrée que tu définis."],
  jackpot:["Le Jackpot","Joué en criant « Flambeur ! » : tous les points de la manche sont doublés."],
  inflation:["L’Inflation de crise","Pas de mise minimale ce tour : tu peux annoncer le même nombre ou à peine plus."]
};

let CUS=[], REQ=[], S={
  role:"player",
  screen:"setup",
  names:["Joueur 1","Joueur 2","Joueur 3"],
  err:"",modal:null,mode:null,showJk:false,f:{},qerr:"",exp:"",pinErr:""
};

try{
 const t=JSON.parse(localStorage.getItem("fl_names")||"null");if(Array.isArray(t)&&t.length>=3)S.names=t.slice(0,10);
 const c=JSON.parse(localStorage.getItem("fl_custom")||"null");if(Array.isArray(c))CUS=c;
 const r=JSON.parse(localStorage.getItem("fl_requests")||"null");if(Array.isArray(r))REQ=r;
}catch(e){}

const saveC=()=>{try{localStorage.setItem("fl_custom",JSON.stringify(CUS))}catch(e){}},
      saveR=()=>{try{localStorage.setItem("fl_requests",JSON.stringify(REQ))}catch(e){}};

const all=()=>BASE.concat(CUS), last=()=>S.bids.length?S.bids[S.bids.length-1].v:null;

function start(){
 try{localStorage.setItem("fl_names",JSON.stringify(S.names))}catch(e){}
 S.players=S.names.map((n,i)=>({name:n.trim()||"Joueur "+(i+1),pts:0,jk:shuf(Object.keys(JK)).slice(0,2)}));
 S.deck=[];S.start=Math.floor(Math.random()*S.players.length);S.winner=null;round();
}

function round(){
 if(!S.deck.length)S.deck=shuf(all());
 S.q=S.deck.pop();S.bids=[];S.last=-1;S.cur=S.start;S.range=null;S.nextRange=null;S.banned={};S.mode=null;S.showJk=false;S.err="";S.modal=null;S.screen="round";render();
}

const topNavH=()=>`
<div class="top-nav">
  <button class="btn mode-badge ${S.role==='dev'?'dev':''}" data-a="openPin">
    <span>${S.role==='dev'?'🛠️ Développeur':'🎮 Mode Joueur'}</span>
    <small style="opacity:0.8;margin-left:4px">(${S.role==='dev'?'Déconnexion':'Activer'})</small>
  </button>
  ${REQ.length && S.role==='dev'?`<span style="background:var(--acc);color:#fff;font-size:12px;font-weight:bold;padding:4px 10px;border-radius:999px">${REQ.length} req.</span>`:''}
</div>`;

const sb=()=>`<div class="sb">${S.players.map((p,i)=>`<div class="chip ${S.screen==="round"&&i===S.cur?"on":""}"><span>${esc(p.name)}</span><b>${p.pts}</b></div>`).join("")}</div>`;

function setupH(){
 return topNavH()+`
<div class="hero">
  <div class="hero-logo-wrap">${LOGO}</div>
  <h1>${esc(NAME)}</h1>
  <p>Bluff, estimation & surenchères. 3 à 10 joueurs sur un seul écran.</p>
</div>

${S.role==='dev'?`
<div class="card" style="border-color:var(--gold)">
  <h2>🛠️ Espace Développeur & Modération</h2>
  <p class="mut">Accès réservé. Valide ou rejette les propositions des joueurs.</p>
  <div class="row">
    <button class="btn pri grow" data-a="qs">Gérer & Valider (${REQ.length} en attente)</button>
  </div>
</div>`:''}

<div class="card">
  <h2>Joueurs</h2>
  ${S.names.map((n,i)=>`
    <div class="row" style="margin:6px 0">
      <input type="text" class="grow" data-n="${i}" value="${esc(n)}" aria-label="Joueur ${i+1}" maxlength="16">
      ${S.names.length>3?`<button class="btn red" data-a="del" data-i="${i}">✕</button>`:""}
    </div>`).join("")}
  <div class="row" style="margin-top:12px">
    ${S.names.length<10?`<button class="btn grow" data-a="add">+ Joueur</button>`:""}
    <button class="btn pri grow" data-a="go">Lancer la partie</button>
  </div>
</div>

<button class="btn" style="width:100%" data-a="suggest">💡 Proposer une question au Dev</button>

<details class="card">
  <summary>Règles du jeu</summary>
  <p>Une question à réponse numérique est tirée. Le premier joueur propose une estimation, puis chacun surenchérit ou crie « Flambeur ! ».</p>
  <p><b>Mise minimale :</b> Ajoute 1 au 2ème chiffre (ex: 42 → 43, 353 → 363, 990 → 1 000).</p>
  <p><b>Flambeur !</b> Si le dernier joueur a dépassé la réponse exacte, l'accusateur gagne 1 pt (accusé -1 pt). Sinon, l'accusé gagne 1 pt. Score exact = +2 pts !</p>
</details>`+modalH();
}

function qsH(){
 const f=S.f;
 return topNavH()+`
<h1>🛠️ Modération Questions</h1>
<p class="mut" style="text-align:center">Espace privé du créateur pour valider ou ajouter des questions.</p>

${REQ.length?`
<div class="card" style="border-color:var(--acc)">
  <h2 style="color:var(--acc)">📥 Requêtes reçues (${REQ.length})</h2>
  <p class="mut">Questions soumises par les joueurs :</p>
  ${REQ.map((c,i)=>`
    <div class="card" style="background:var(--bg);margin:8px 0;border-color:var(--line)">
      <span><b>${esc(c.q)}</b><br>Réponse : <b style="color:var(--gold)">${fmt(c.a)} ${esc(c.u)}</b> (${esc(c.s||"non précisée")})</span>
      <div class="row" style="margin-top:10px">
        <button class="btn pri grow" data-a="reqacc" data-i="${i}">✓ Accepter</button>
        <button class="btn red grow" data-a="reqrej" data-i="${i}">✕ Rejeter</button>
      </div>
    </div>`).join("")}
</div>`:''}`+

`<div class="card">
  <h2>Ajouter directement une question</h2>
  <label for="nq">Question</label><textarea id="nq" rows="2">${esc(f.q||"")}</textarea>
  <div class="row">
    <div class="grow"><label for="nu">Unité</label><input type="text" id="nu" value="${esc(f.u||"")}" placeholder="ex. mètres"></div>
    <div class="grow"><label for="na">Réponse</label><input type="number" id="na" inputmode="numeric" value="${esc(f.a||"")}"></div>
  </div>
  <label for="ns">Source</label><input type="text" id="ns" value="${esc(f.s||"")}">
  <p class="err" role="alert">${esc(S.qerr)}</p>
  <button class="btn pri" data-a="qaddDirect" style="width:100%;margin-top:6px">+ Incorporer immédiatement</button>
</div>

${CUS.length?`
<div class="card">
  <h2>Questions créées (${CUS.length})</h2>
  ${CUS.map((c,i)=>`
    <div class="row" style="justify-content:space-between;margin:8px 0;border-bottom:1px solid var(--line);padding-bottom:6px">
      <span style="font-size:14px">${esc(c.q)} <b style="color:var(--gold)">${fmt(c.a)} ${esc(c.u)}</b></span>
      <button class="btn red" data-a="qdel" data-i="${i}" style="min-height:36px;padding:4px 10px">✕</button>
    </div>`).join("")}
</div>`:""}

<div class="card">
  <h2>Export JSON</h2>
  <button class="btn" data-a="qexp">Exporter la base JSON</button>
  ${S.exp?`<textarea readonly rows="4" style="margin-top:8px">${esc(S.exp)}</textarea>`:""}
  <label for="imp">Importer JSON</label>
  <textarea id="imp" rows="2"></textarea>
  <button class="btn" style="margin-top:8px;width:100%" data-a="qimp">Importer</button>
</div>

<button class="btn pri" data-a="menu" style="width:100%;margin-top:10px">← Retour au Menu</button>`;
}

function suggestH(){
 const f=S.f;
 return topNavH()+`
<h1>💡 Proposer une question</h1>
<p class="mut" style="text-align:center">Propose ta question ! Elle sera transmise au Développeur pour validation.</p>

<div class="card">
  <label for="nq">Ta question</label>
  <textarea id="nq" rows="3" placeholder="ex. Combien de dents possède un escargot ?">${esc(f.q||"")}</textarea>
  <div class="row">
    <div class="grow">
      <label for="nu">Unité</label>
      <input type="text" id="nu" value="${esc(f.u||"")}" placeholder="dents, habitants, km...">
    </div>
    <div class="grow">
      <label for="na">Réponse</label>
      <input type="number" id="na" inputmode="numeric" value="${esc(f.a||"")}">
    </div>
  </div>
  <label for="ns">Source (facultatif)</label>
  <input type="text" id="ns" value="${esc(f.s||"")}">
  <p class="err" role="alert">${esc(S.qerr)}</p>
  <button class="btn pri" data-a="qreq" style="width:100%;margin-top:10px">🚀 Envoyer la proposition</button>
</div>

<button class="btn" data-a="menu" style="width:100%">← Annuler / Retour</button>`;
}

function roundH(){
 const p=S.players[S.cur],L=last(),m=S.mode;
 const mn=m==="inflation"&&L!==null?L:(L===null?1:minRaise(L));
 const hist=S.bids.slice(-4).map(b=>`${esc(b.n)} : ${fmt(b.v)}`).join(" · ");
 const avail=p.jk.filter(k=>!(S.banned[S.cur]||[]).includes(k)),ban=(S.banned[S.cur]||[]).filter(k=>p.jk.includes(k));
 return topNavH()+sb()+`<div class="qc"><p class="mut">Réponse exprimée en : <b>${esc(S.q.u)}</b></p><p class="q">${esc(S.q.q)}</p></div>
<div class="card"><p class="mut">${L===null?"Première mise":"Dernière mise par "+esc(S.bids[S.bids.length-1].n)}</p><div class="bid"><p class="big">${L===null?"—":fmt(L)}</p></div><p class="hist">${hist}</p></div>
<div class="card"><h2>À ${esc(p.name)} de jouer</h2>
<p class="mut">Mise minimale : <b>${fmt(mn)}</b>${S.range?` · Fourchette imposée : ${fmt(S.range.lo)} à ${fmt(S.range.hi)}`:""}${m==="miroir"?" · Miroir : mêmes chiffres, ordre libre":""}</p>
<input type="number" id="bid" inputmode="numeric" min="1" step="1" placeholder="Saisis ton chiffre" aria-label="Ta mise">
${m==="fourchette"?`<div class="row" style="margin-top:8px"><input type="number" id="lo" inputmode="numeric" placeholder="Min fourchette"><input type="number" id="hi" inputmode="numeric" placeholder="Max fourchette"></div>`:""}
<p class="err" role="alert">${esc(S.err)}</p>
<div class="row" style="margin-top:8px"><button class="btn pri grow" data-a="bid">Surenchérir</button><button class="btn red grow" data-a="acc" ${L===null?"disabled":""}>FLAMBEUR !</button></div>
<div class="row" style="margin-top:10px"><button class="btn grow" data-a="jk">🃏 Jokers secrets (${p.jk.length})</button>${m?`<button class="btn" data-a="nomode">Annuler joker</button>`:""}</div>
${S.showJk?`<p class="up">🔒 Cache l'écran aux autres joueurs.</p>${p.jk.length?"":"<p class=mut>Plus de joker disponible.</p>"}${avail.map(k=>`<div class="jk"><b>${JK[k][0]}</b><p>${JK[k][1]}</p>${k==="jackpot"?`<span class="mut">S'active au moment de crier « Flambeur ! ».</span>`:`<button class="btn pri" data-a="play" data-k="${k}" ${(k==="miroir"||k==="inflation")&&L===null?"disabled":""}>Activer ce joker</button>`}</div>`).join("")}${ban.map(k=>`<div class="jk mut">${JK[k][0]} — Interdit cette manche</div>`).join("")}`:""}</div>`+modalH();
}

function modalH(){
 const M=S.modal;if(!M)return"";let h="";
 if(M.t==="pin"){
   h=`<h2>🔐 Code PIN Développeur</h2>
      <p class="mut">Saisis le code PIN à 4 chiffres pour passer en Mode Développeur :</p>
      <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••" style="text-align:center;font-size:24px;letter-spacing:6px">
      <p class="err">${esc(S.pinErr)}</p>
      <button class="btn pri" data-a="checkPin" style="width:100%;margin-top:8px">Valider</button>`;
 }
 else if(M.t==="acc"){
   h=`<h2>Qui crie « FLAMBEUR ! » ?</h2><p class="mut">Accusé : <b>${esc(S.players[S.last].name)}</b></p>`+S.players.map((p,i)=>i===S.last?"":`<button class="btn" data-a="res" data-i="${i}" data-j="0">${esc(p.name)}</button>${p.jk.includes("jackpot")&&!(S.banned[i]||[]).includes("jackpot")?`<button class="btn pri" data-a="res" data-i="${i}" data-j="1">💥 ${esc(p.name)} avec le JACKPOT (×2)</button>`:""}`).join("");
 }
 else if(M.t==="rg"&&M.op==null){
   h=`<h2>Regarder les jokers de qui ?</h2>`+S.players.map((p,i)=>i===S.cur?"":`<button class="btn" data-a="rgop" data-i="${i}">${esc(p.name)}</button>`).join("");
 }
 else if(M.t==="rg"){
   const o=S.players[M.op];
   h=`<h2>Jokers de ${esc(o.name)}</h2>${o.jk.length?"<p>Interdis-lui un joker pour cette manche :</p>":"<p>Aucun joker en main.</p>"}`+o.jk.map(k=>`<button class="btn red" data-a="ban" data-k="${k}">Bloquer ${JK[k][0]}</button>`).join("")+`<button class="btn" data-a="ban" data-k="">Ne rien bloquer</button>`;
 }
 return `<div class="modal" role="dialog" aria-modal="true"><div>${h}<button class="btn pri" data-a="close" style="margin-top:12px;width:100%">Annuler / Fermer</button></div></div>`;
}

function resolve(ai,jp){
 const cu=S.players[S.last],bid=last(),ans=S.q.a,k=jp?2:1,d=S.players.map(()=>0);let txt,lo;
 if(bid>ans){d[ai]+=k;d[S.last]-=k;lo=S.last;txt=`Accusation réussie ! La mise de ${esc(cu.name)} (${fmt(bid)}) dépassait la réalité.`}
 else{const ex=bid===ans;d[S.last]+=(ex?2:1)*k;d[ai]-=k;lo=ai;txt=ex?`Mise exacte ! ${esc(cu.name)} réussit un coup de maître !`:`Accusation ratée ! ${esc(cu.name)} n'avait pas dépassé le vrai chiffre.`}
 if(jp){const a=S.players[ai].jk.indexOf("jackpot");S.players[ai].jk.splice(a,1)}
 S.players.forEach((p,i)=>p.pts+=d[i]);
 const top=Math.max(...S.players.map(p=>p.pts));S.winner=top>=5?S.players.findIndex(p=>p.pts===top):null;
 S.res={txt,d,lo,bid,jp};S.start=lo;S.modal=null;S.screen="reveal";render();
}

function revealH(){
 const r=S.res,q=S.q;
 return topNavH()+sb()+`<div class="qc"><p class="mut">La réponse exacte était</p><div class="bid"><p class="big">${fmt(q.a)}</p></div><p class="mut">${esc(q.u)} — Source : ${esc(q.s||"Standard")}</p></div>
<div class="card"><p>Dernière mise : <b>${fmt(r.bid)}</b></p><p><b>${r.txt}</b>${r.jp?" 💥 Jackpot : Points doublés !":""}</p><p>${S.players.map((p,i)=>r.d[i]?`${esc(p.name)} : <b>${r.d[i]>0?"+":""}${r.d[i]} pt</b>`:"").filter(Boolean).join(" · ")}</p></div>
<button class="btn pri" style="width:100%" data-a="${S.winner!=null?"end":"next"}">${S.winner!=null?"Voir le vainqueur de la partie":"Manche suivante — "+esc(S.players[S.start].name)+" commence"}</button>`;
}

function endH(){
 const w=S.players[S.winner],r=S.players.slice().sort((a,b)=>b.pts-a.pts);
 return topNavH()+`<div class="hero">${LOGO}<h1>${esc(w.name)} gagne !</h1><p class="mut">Score d'excellence atteint !</p></div><div class="card">${r.map(p=>`<div class="row" style="justify-content:space-between;margin:8px 0"><span>${esc(p.name)}</span><b style="color:var(--gold);font-size:20px">${p.pts} pts</b></div>`).join("")}</div><div class="row"><button class="btn pri grow" data-a="again">Rejouer une partie</button><button class="btn grow" data-a="menu">Menu principal</button></div>`;
}

function render(){
 $("#app").innerHTML=
  S.screen==="setup"?setupH():
  S.screen==="qs"?qsH():
  S.screen==="suggest"?suggestH():
  S.screen==="round"?roundH():
  S.screen==="reveal"?revealH():endH();
 window.scrollTo(0,0);
}

function bid(){
 const p=S.players[S.cur],L=last(),m=S.mode,v=parseInt($("#bid").value,10);let e="",nr=null;
 if(!(v>=1))e="Entre un nombre entier valide.";
 else if(L!==null){if(m==="miroir"){if(sig(v)!==sig(L))e="Utilise exactement les mêmes chiffres que la mise précédente."}
  else if(v<(m==="inflation"?L:minRaise(L)))e=`Mise minimale obligatoire : ${fmt(m==="inflation"?L:minRaise(L))}.`}
 if(!e&&S.range&&(v<S.range.lo||v>S.range.hi))e=`Reste dans la fourchette imposée : ${fmt(S.range.lo)} à ${fmt(S.range.hi)}.`;
 if(!e&&m==="fourchette"){const lo=parseInt($("#lo").value,10),hi=parseInt($("#hi").value,10);
  if(!(lo>=minRaise(v)))e=`Fourchette min >= ${fmt(minRaise(v))}.`;else if(!(hi>=lo))e="Fourchette max invalide.";else nr={lo,hi}}
 if(e){S.err=e;render();return}
 if(m)p.jk.splice(p.jk.indexOf(m),1);
 S.bids.push({n:p.name,v});S.last=S.cur;S.range=nr;S.cur=(S.cur+1)%S.players.length;S.mode=null;S.showJk=false;S.err="";render();
}

function readF(){const g=i=>($(i)||{}).value||"";S.f={q:g("#nq"),u:g("#nu"),a:g("#na"),s:g("#ns")}}

function qreq(){
 readF();const f=S.f,a=parseInt(f.a,10);
 if(!f.q.trim()||!f.u.trim())S.qerr="Remplis au moins la question et l'unité.";
 else if(!(a>=1))S.qerr="Réponse valide obligatoire.";
 else{
   REQ.push({q:f.q.trim(),u:f.u.trim(),a,s:f.s.trim()});
   saveR();S.f={};S.qerr="";
   alert("Merci ! Ta proposition a été envoyée au Développeur pour validation.");
   S.screen="setup";
 }
 render();
}

function qaddDirect(){
 readF();const f=S.f,a=parseInt(f.a,10);
 if(!f.q.trim()||!f.u.trim())S.qerr="Renseigne la question et l'unité.";
 else if(!(a>=1))S.qerr="Réponse invalide.";
 else{CUS.push({q:f.q.trim(),u:f.u.trim(),a,s:f.s.trim()});saveC();S.f={};S.qerr=""}
 render();
}

function qimp(){
 let t;try{t=JSON.parse($("#imp").value)}catch(e){S.qerr="Format JSON invalide.";return render()}
 if(!Array.isArray(t)){S.qerr="Doit être une liste JSON.";return render()}
 const ok=t.filter(c=>c&&typeof c.q==="string"&&typeof c.u==="string"&&Number.isInteger(c.a)&&c.a>=1);
 CUS=CUS.concat(ok);saveC();S.qerr=ok.length+" question(s) importée(s).";render();
}

const minRaise=n=>{const l=String(n).length;return l<2?n+1:n+Math.pow(10,l-2)},
      shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
      sig=n=>String(n).split("").sort().join(""),
      $=s=>document.querySelector(s),
      fmt=n=>Number(n).toLocaleString("fr-FR"),
      esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.addEventListener("input",e=>{const i=e.target.dataset.n;if(i!=null)S.names[i]=e.target.value});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const a=b.dataset.a,i=+b.dataset.i;

 if(a==="openPin"){
   if(S.role === "dev"){
     S.role = "player";
     if(S.screen === "qs") S.screen = "setup";
     render();
   } else {
     S.pinErr = "";
     S.modal = {t:"pin"};
     render();
   }
 }
 else if(a==="checkPin"){
   const pinVal = ($("#pinInput")||{}).value;
   if(pinVal === PIN){
     S.role = "dev";
     S.modal = null;
     S.pinErr = "";
     render();
   } else {
     S.pinErr = "Code PIN incorrect.";
     render();
   }
 }
 else if(a==="add")S.names.push("Joueur "+(S.names.length+1));
 else if(a==="del")S.names.splice(i,1);
 else if(a==="go")return start();
 else if(a==="qs"){S.screen="qs";S.qerr="";S.exp=""}
 else if(a==="suggest"){S.screen="suggest";S.qerr=""}
 else if(a==="qreq")return qreq();
 else if(a==="qaddDirect")return qaddDirect();
 else if(a==="reqacc"){CUS.push(REQ.splice(i,1)[0]);saveC();saveR()}
 else if(a==="reqrej"){REQ.splice(i,1);saveR()}
 else if(a==="qdel"){CUS.splice(i,1);saveC()}
 else if(a==="qexp")S.exp=JSON.stringify(CUS);
 else if(a==="qimp")return qimp();
 else if(a==="bid")return bid();
 else if(a==="acc")S.modal={t:"acc"};
 else if(a==="res")return resolve(i,b.dataset.j==="1");
 else if(a==="jk")S.showJk=!S.showJk;
 else if(a==="nomode")S.mode=null;
 else if(a==="play"){const k=b.dataset.k;if(k==="regard")S.modal={t:"rg",op:null};else S.mode=k;S.err=""}
 else if(a==="rgop")S.modal={t:"rg",op:i};
 else if(a==="ban"){const p=S.players[S.cur],k=b.dataset.k,o=S.modal.op;p.jk.splice(p.jk.indexOf("regard"),1);if(k)(S.banned[o]=S.banned[o]||[]).push(k);S.modal=null}
 else if(a==="close")S.modal=null;
 else if(a==="next")return round();
 else if(a==="end")S.screen="end";
 else if(a==="again")return start();
 else if(a==="menu")S.screen="setup";
 render();
});

// Service Worker pour PWA offline / PWABuilder
if ('serviceWorker' in navigator) {
  const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));`;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

render();
</script></body></html>
